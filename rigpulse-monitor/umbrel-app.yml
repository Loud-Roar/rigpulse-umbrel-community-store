description: >-
  RigPulse is a local-first dashboard for monitoring mixed ASIC mining fleets
  directly over your LAN. It supports SHA-256 and Blake3 miners, live share
  celebrations, fleet health, historical telemetry, pool status, best-share
  tracking, Bitcoin network status, alerts, and customizable dashboard themes.
